# CI dos testes do ServeRest. Cada ferramenta é um job em paralelo.
#
# Quando roda:
# - push e pull request: só os jobs cuja pasta mudou (mexeu só no cypress/,
#   roda só o Cypress); mudança só em arquivos .md não dispara nada;
# - toda noite (03:00 de Brasília): TUDO, mesmo sem mudança no código, para
#   descobrir quando o próprio ServeRest (front público) mudou;
# - à mão, pela aba Actions ("Run workflow"): tudo.
#
# A API do ServeRest sobe como "service container" (a mesma imagem do
# compose.yaml), então nada depende do servidor público e do limite 429.
# Ela começa vazia a cada execução: as credenciais abaixo são só desta base
# descartável (não são segredos) e os testes criam o admin antes de rodar.
name: Testes

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 03:00 em Brasília
  workflow_dispatch:

env:
  SERVEREST_API_URL: http://localhost:3000
  SERVEREST_EMAIL: qa.ci@teste.com
  SERVEREST_SENHA: teste123

jobs:
  # Descobre quais pastas mudaram neste push/PR. Mudança no próprio workflow
  # conta para todos os jobs.
  mudancas:
    name: Pastas alteradas
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      playwright: ${{ steps.filtro.outputs.playwright }}
      cypress: ${{ steps.filtro.outputs.cypress }}
      k6: ${{ steps.filtro.outputs.k6 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            playwright: ["playwright/**", ".github/workflows/**"]
            cypress: ["cypress/**", ".github/workflows/**"]
            k6: ["k6/**", ".github/workflows/**"]

  playwright:
    name: Playwright (Chromium)
    needs: mudancas
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.mudancas.outputs.playwright == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      serverest:
        image: paulogoncalvesbh/serverest:latest
        ports: ["3000:3000"]
    defaults:
      run:
        working-directory: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # O teste da senha falha de propósito (defeito real do ServeRest):
      # fica fora do CI para o selo não ficar vermelho para sempre.
      - run: npx playwright test --project=chromium --grep-invert "não deve exibir a senha"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-relatorio
          path: |
            playwright/playwright-report/
            playwright/test-results/
          retention-days: 14

  cypress:
    name: Cypress (Electron)
    needs: mudancas
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.mudancas.outputs.cypress == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      serverest:
        image: paulogoncalvesbh/serverest:latest
        ports: ["3000:3000"]
    steps:
      - uses: actions/checkout@v4
      # A action do Cypress instala as dependências (com cache) e roda o cypress run.
      # Variáveis CYPRESS_* viram Cypress.env("...") nos testes.
      - uses: cypress-io/github-action@v6
        with:
          working-directory: cypress
        env:
          CYPRESS_SERVEREST_API_URL: ${{ env.SERVEREST_API_URL }}
          CYPRESS_SERVEREST_EMAIL: ${{ env.SERVEREST_EMAIL }}
          CYPRESS_SERVEREST_SENHA: ${{ env.SERVEREST_SENHA }}
          CYPRESS_PULAR_DEFEITOS_CONHECIDOS: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/cypress/screenshots/
          retention-days: 14

  k6:
    name: k6 (smoke do login pela API)
    needs: mudancas
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.mudancas.outputs.k6 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      serverest:
        image: paulogoncalvesbh/serverest:latest
        ports: ["3000:3000"]
    defaults:
      run:
        working-directory: k6
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      # Só o smoke da API: o login pelo navegador usa o front e a API públicos.
      - run: k6 run -e API_URL=${{ env.SERVEREST_API_URL }} tests/login.js
